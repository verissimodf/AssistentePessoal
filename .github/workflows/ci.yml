name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci
        working-directory: server
      - name: Testes do painel
        run: npx vitest run
      - name: Testes do serviço local
        run: node --no-warnings --test tests/*.test.mjs
      - name: Serviço sobe e responde
        shell: bash
        run: |
          (cd server && node --no-warnings index.js &) ; sleep 3
          curl -sf http://127.0.0.1:7777/api/health

  container:
    name: Container — build e inicialização
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem de produção
        run: docker build --tag assistente-pessoal:ci .
      - name: Validar inicialização da API e do painel
        shell: bash
        run: |
          set -Eeuo pipefail
          container_name=assistente-pessoal-ci
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              docker logs "$container_name" >&2 || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container_name" \
            -p 127.0.0.1:17777:7777 \
            -p 127.0.0.1:18090:8090 \
            assistente-pessoal:ci

          api_ok=0
          panel_ok=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:17777/api/health >/tmp/api-health.json; then
              api_ok=1
            fi
            if curl --fail --silent http://127.0.0.1:18090/ >/dev/null; then
              panel_ok=1
            fi
            if [ "$api_ok" -eq 1 ] && [ "$panel_ok" -eq 1 ]; then
              cat /tmp/api-health.json
              printf '\\nAPI e painel responderam no container.\\n'
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_name" 2>/dev/null || echo false)" != "true" ]; then
              echo "Container encerrou antes de ficar saudável." >&2
              exit 1
            fi
            sleep 2
          done
          echo "Timeout aguardando API e painel." >&2
          exit 1

      - name: Fluxo real autenticado (container e banco temporários próprios)
        shell: bash
        run: |
          set -Eeuo pipefail
          # Container PRÓPRIO e efêmero: o container do passo anterior é removido pelo `trap` dele no
          # fim daquele passo. Sem volume do host, sem tocar em nenhum outro serviço.
          container_name=assistente-pessoal-ci-auth
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then docker logs "$container_name" >&2 || true; fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "$container_name" \
            -p 127.0.0.1:27777:7777 \
            -p 127.0.0.1:28090:8090 \
            assistente-pessoal:ci >/dev/null
          API=http://127.0.0.1:27777
          ready=0
          for _ in $(seq 1 45); do
            if curl --fail --silent "$API/api/health" >/dev/null; then ready=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_name" 2>/dev/null || echo false)" != "true" ]; then
              echo "Container efêmero encerrou antes de ficar saudável." >&2
              exit 1
            fi
            sleep 2
          done
          [ "$ready" = "1" ] || { echo "Timeout aguardando a API do container efêmero." >&2; exit 1; }

          TOKEN=$(docker exec "$container_name" cat /app/data/bootstrap-token.txt | tr -d '\r\n')
          USER="ci-smoke-$RANDOM"
          PASS="Ci#$(openssl rand -hex 12)!"
          curl --fail --silent -X POST "$API/api/auth/setup" -H 'content-type: application/json' \
            -d "{\"token\":\"$TOKEN\",\"username\":\"$USER\",\"password\":\"$PASS\"}" >/dev/null

          LOGIN=$(curl --fail --silent -X POST "$API/api/auth/login" -H 'content-type: application/json' \
            -d "{\"username\":\"$USER\",\"password\":\"$PASS\"}" -c /tmp/ci-cookies)
          CSRF=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrf"])')
          authed() { curl --fail --silent -b /tmp/ci-cookies -H "x-jarvis-csrf: $CSRF" "$@"; }

          # P1-C: catálogo de skills provisionado no boot (offline, determinístico).
          skills=$(authed "$API/api/skills")
          printf '%s' "$skills" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["total"]>0, "skills hub vazio"; print("skills:", d["total"])'

          # P1-A: criar e excluir rascunho humano (nunca envia).
          authed -X PUT "$API/api/settings" -H 'content-type: application/json' \
            -d '{"comms":{"gmail":{"enabled":true,"user":"ci@exemplo.test","appPassword":"segredo-de-ci"}}}' >/dev/null
          draft=$(authed -X POST "$API/api/mail/drafts" -H 'content-type: application/json' \
            -d '{"account":"gmail","to":"dest@exemplo.test","subject":"ci","body":"corpo de teste"}')
          DID=$(printf '%s' "$draft" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          authed -X DELETE "$API/api/mail/drafts/$DID" >/dev/null

          # P1-B: teste de conexão explícito como MOCK (nunca afirma conexão real).
          conn=$(authed -X POST "$API/api/mail/gmail/test-connection")
          printf '%s' "$conn" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["mode"]=="mock", d; assert d["imap"]["ok"] is not True; print("test-connection:", d["mode"])'

          # P2-A: TTS sem serviço local devolve estado estruturado (não 500 genérico).
          code=$(curl --silent -o /tmp/tts.json -w '%{http_code}' -b /tmp/ci-cookies -H "x-jarvis-csrf: $CSRF" \
            -X POST "$API/api/tts" -H 'content-type: application/json' -d '{"text":"teste ci"}')
          python3 -c 'import json; d=json.load(open("/tmp/tts.json")); assert d.get("error"), d; print("tts:", d["error"])'

          # P2-B: diagnóstico reflete o catálogo de skills e a versão/commit do build.
          diag=$(authed "$API/api/diagnostics")
          printf '%s' "$diag" | python3 -c 'import json,sys; d=json.load(sys.stdin); items={i["id"]: i for i in d["itens"]}; sk=items["servico:skills-hub"]; assert sk["estado"]=="OPERACIONAL", sk["estado"]; assert d["versao"]["app"]; print("diagnostico: skills", sk["estado"], "| versao", d["versao"]["app"])'
          echo "Fluxo autenticado do container validado."

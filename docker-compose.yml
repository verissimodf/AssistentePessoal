# J.A.R.V.I.S. — implantação em container na rede Docker existente `CNC_APP_PROD_01`.
#
# Regras de contenção:
#   - NENHUM `ports:` — o assistente não publica porta alguma no host.
#   - O container escuta no próprio endereço da rede Docker (nunca 0.0.0.0).
#   - O Nginx (`nginx-app`) alcança painel e API pelo DNS do serviço na mesma rede.
#
# Uso (somente após aprovação e com o serviço systemd original parado):
#   docker compose -f docker-compose.yml up -d --build
#   docker compose -f docker-compose.yml ps
#   docker compose -f docker-compose.yml logs -f
name: assistente-pessoal

services:
  assistente:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Identidade da ÁRVORE construída — injetada no `server/build-info.json` e no label OCI.
        # O commit vem SÓ daqui: o processo em runtime não tem git e nunca infere do branch.
        BUILD_VERSION: ${BUILD_VERSION:-sem-build}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_COMMIT_STATUS: ${BUILD_COMMIT_STATUS:-unknown}
        SCHEMA_VERSION: ${SCHEMA_VERSION:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        # `RELEASE_BUILD=1` ativa a validação ESTRITA dos metadados no build (falha sem SHA
        # completo/versão/schema/status/instante). Releases usam `RELEASE_BUILD=1`.
        RELEASE_BUILD: ${RELEASE_BUILD:-}
    # Tag dirigida pela release (P0.3.1): um deploy exporta `IMAGE_TAG` (ex.: 1.0.0) para a nova
    # imagem NÃO sobrescrever a tag da versão em produção — que fica disponível como rollback.
    # Por omissão mantém a tag atual para não partir fluxos que correm `compose up --build` sem env.
    image: assistente-pessoal:${IMAGE_TAG:-1.9.2}
    container_name: assistente-pessoal
    restart: unless-stopped
    # Não-root vem da própria imagem (`USER 1000:1000`), não duplicado aqui.
    # Endurecimento: sem privilégios extras e sem capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      JARVIS_DATA_DIR: "/app/data"
      JARVIS_PORT: "7777"
      PANEL_PORT: "8090"
      # Serviço de transcrição local opcional; habilitado pelo profile `stt`.
      JARVIS_STT_URL: "http://stt:8080"
      # Ponte de voz -> xtts-service pela rede Docker.
      XTTS_URL: "http://xtts-service:8000"
      XTTS_SPEAKER: ${XTTS_SPEAKER:-jarvis-ptbr}
      OPENHANDS_URL: ${OPENHANDS_URL:-http://openhands:8000}
      OPENHANDS_API_KEY: ${OPENHANDS_API_KEY:-}
      OPENHANDS_MODEL: ${OPENHANDS_MODEL:-openai/qwen2.5:7b}
      HEADROOM_PROXY_TOKEN: ${HEADROOM_PROXY_TOKEN:-}
      OPENAI_BASE_URL: http://headroom:8787/v1
      OPENAI_API_KEY: ${HEADROOM_PROXY_TOKEN:-}
      ANTHROPIC_BASE_URL: http://headroom:8787
      ANTHROPIC_CUSTOM_HEADERS: "X-Headroom-Proxy-Token: ${HEADROOM_PROXY_TOKEN:-}"
      OPENCODE_CONFIG_CONTENT: >-
        {"$$schema":"https://opencode.ai/config.json","provider":{"headroom":{"npm":"@ai-sdk/openai-compatible","name":"Headroom local","options":{"baseURL":"http://headroom:8787/v1","apiKey":"${HEADROOM_PROXY_TOKEN:-}"},"models":{"qwen2.5:7b":{"name":"Qwen 2.5 7B"}}}}}
      # Origens autorizadas (header Origin), sem curingas. Inclui tailnet (relé no host)
      # e o hostname HTTPS (ativado na Fase 7).
      JARVIS_ALLOWED_ORIGINS: "http://100.87.104.126:8090,http://app.tail43f1fb.ts.net:8090,https://jarvis.laytech.com.br,http://192.168.2.40:8090"
      # AgentMail (server/agentmail.js): fallback operacional — a config canônica é o painel
      # (global_settings.integrations.agentmail, apiKey/secret criptografados). Interpolação do
      # .env local (nunca commitado); vazio = desativado no fallback, a integração segue fail-closed.
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY:-}
      AGENTMAIL_WEBHOOK_SECRET: ${AGENTMAIL_WEBHOOK_SECRET:-}
      AGENTMAIL_INBOX_ID: ${AGENTMAIL_INBOX_ID:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_REDIRECT_URI: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-common}
    volumes:
      # Banco SQLite (+ WAL/SHM), master.key, vozes e backups — mesmo volume persistente.
      - /opt/laytech-ai/AssistentePessoal/data:/app/data
    networks:
      CNC_APP_PROD_01:
        ipv4_address: 192.168.2.40

  stt:
    profiles: ["stt"]
    build:
      context: .
      dockerfile: Dockerfile.stt
    image: assistente-pessoal-stt:whisper-cpu
    container_name: assistente-pessoal-stt
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 6g
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    environment:
      WHISPER_MODEL: /models/ggml-small.bin
      WHISPER_THREADS: "4"
    volumes:
      - /opt/laytech-ai/AssistentePessoal/data/whisper-models:/models:ro
    networks:
      CNC_APP_PROD_01:
        aliases: [stt]

networks:
  CNC_APP_PROD_01:
    external: true

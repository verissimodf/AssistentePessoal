# =============================================================================
# J.A.R.V.I.S. — bloco Nginx isolado para jarvis.laytech.com.br
# =============================================================================
# Este arquivo é um RASCUNHO de configuração de teste. Ele NÃO é carregado pelo
# Nginx enquanto não for inserido dentro do bloco `http { }` de
# /opt/laytech-ai/volumes/nginx/nginx.conf.
#
# Estratégia de mesma origem: um único hostname serve o painel (8090) e a API (7777).
#   /api/  -> API do assistente
#   /      -> painel
# Isso evita CORS e preserva o cookie SameSite=Strict.
#
# O destino usa o DNS do serviço na rede Docker CNC_APP_PROD_01 (resolver 127.0.0.11
# já definido em http{}), com `set` + variável para resolver a cada requisição.
#
# Não altera nenhum bloco existente. Inserir antes do fechamento de `http { }`.
# =============================================================================
    server {
        listen 80;
        server_name jarvis.laytech.com.br;

        # Uploads do assistente (o backend limita em JARVIS_MAX_UPLOAD, padrão 25M).
        client_max_body_size 25M;

        location /api/ {
            set $jarvis_api assistente-pessoal:7777;
            proxy_pass http://$jarvis_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            set $jarvis_panel assistente-pessoal:8090;
            proxy_pass http://$jarvis_panel;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }
    }
